[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "axiom-os"
version = "1.0.0"
description = "Dual-Speed Neuromorphic Workstation & Mobile Copilot"
readme = "README.md"
authors = [{ name = "Axiom Engineering Team" }]
license = { text = "Apache-2.0" }
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: Microsoft :: Windows",
    "Topic :: System :: Operating System"
]
dependencies = [
    "pydantic>=2.0.0",
    "numpy>=1.22.0",
    "pillow>=9.0.0",
    "psutil>=5.9.0",
    "pywin32>=305",
    "websockets>=11.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0"
]
